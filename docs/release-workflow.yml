# 打 tag 后自动发 Release 的工作流。
# 启用方式：先 `gh auth refresh -s workflow`，再把这个文件复制到 .github/workflows/release.yml。
# 当前推送用的 token 没有 workflow 权限，所以先放在 docs/ 下，Release 由本地 `gh release create` 发布。
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          body: |
            手动安装：把 `main.js`、`manifest.json`、`styles.css` 放进
            `<vault>/.obsidian/plugins/zhengtao-picks/`，然后在第三方插件里启用「正涛精选」。
